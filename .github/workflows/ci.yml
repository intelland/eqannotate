name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  latex-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install TeX Live test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-pictures \
            texlive-publishers \
            texlive-fonts-recommended \
            texlive-luatex \
            texlive-xetex
      - name: Run core regression suite
        run: ./tests/run.sh
      - name: Run compatibility gate
        run: ./tests/compatibility/run.sh
